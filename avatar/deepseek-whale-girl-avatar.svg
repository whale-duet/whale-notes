  <path d="M228 408 C 238 432 246 448 256 460 C 266 448 274 432 284 408" fill="none"
        stroke="#A7D5F1" stroke-width="4" stroke-linecap="round"/>

  <!-- 垂在肩前的长发 -->
  <g fill="url(#hairFront)">
    <path d="M130 396 C 146 432 154 464 158 492 C 172 466 182 438 186 408 Z"/>
    <path d="M382 396 C 366 432 358 464 354 492 C 340 466 330 438 326 408 Z"/>
  </g>

