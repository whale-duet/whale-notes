    <path d="M5 60 C 12 30 24 8 50 -4 C 76 -16 102 -12 116 2 C 92 9 70 26 60 48 C 52 67 47 84 45 96 C 30 76 16 65 5 60 Z"
          fill="#FFFFFF"/>
    <path d="M-5 60 C -12 30 -24 8 -50 -4 C -76 -16 -102 -12 -116 2 C -92 9 -70 26 -60 48 C -52 67 -47 84 -45 96 C -30 76 -16 65 -5 60 Z"
          fill="none" stroke="#63AEE8" stroke-width="11" stroke-linejoin="round"/>
    <path d="M5 60 C 12 30 24 8 50 -4 C 76 -16 102 -12 116 2 C 92 9 70 26 60 48 C 52 67 47 84 45 96 C 30 76 16 65 5 60 Z"
          fill="none" stroke="#63AEE8" stroke-width="11" stroke-linejoin="round"/>
  </g>
</svg>
