    <path d="M-8 52 C -22 32 -38 18 -58 10" fill="none" stroke="#D6F1FF" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round"/>
    <path d="M8 52 C 22 32 38 18 58 10" fill="none" stroke="#D6F1FF" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round"/>
    <path d="M-4 62 C -6 78 -8 88 -12 96" fill="none" stroke="#BFE4FF" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 脸 -->
  <path d="M256 148 C 192 148 166 196 166 248 C 166 294 186 324 214 338 C 226 345 244 348 256 348 C 268 348 286 345 298 338 C 326 324 346 294 346 248 C 346 196 320 148 256 148 Z"
        fill="url(#skinGrad)"/>

  <!-- 腮红 -->
  <ellipse cx="198" cy="298" rx="27" ry="14" fill="url(#cheekGrad)"/>
  <ellipse cx="314" cy="298" rx="27" ry="14" fill="url(#cheekGrad)"/>
  <g stroke="#FF8494" stroke-opacity="0.6" stroke-width="3.5" stroke-linecap="round">
    <path d="M188 294 L 186 302"/>
    <path d="M199 293 L 197 301"/>
    <path d="M210 294 L 208 302"/>
    <path d="M302 294 L 300 302"/>
    <path d="M313 293 L 311 301"/>
    <path d="M324 294 L 322 302"/>
  </g>

  <!-- 眉毛：外高内低，傲娇 -->
  <g fill="none" stroke="#2B6BC0" stroke-width="7" stroke-linecap="round">
    <path d="M184 232 C 202 226 220 230 234 240"/>
    <path d="M328 232 C 310 226 292 230 278 240"/>
  </g>

  <!-- 闭眼 -->
  <g fill="none" stroke="#173F6C" stroke-width="8" stroke-linecap="round">
