<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="DeepSeek 小鲸鱼 Q 版头像">
  <title>DeepSeek 小鲸鱼 · 蓝白长发鲸尾 Q 版头像</title>
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#F7FCFF"/>
      <stop offset="52%" stop-color="#D8EEFF"/>
      <stop offset="100%" stop-color="#A4D2F7"/>
    </radialGradient>
    <linearGradient id="hairBack" x1="0.15" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4E9CE4"/>
      <stop offset="45%" stop-color="#2C6EC4"/>
      <stop offset="100%" stop-color="#163C78"/>
    </linearGradient>
    <linearGradient id="hairFront" x1="0.2" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#74B9F0"/>
      <stop offset="48%" stop-color="#3A82D2"/>
      <stop offset="100%" stop-color="#1B4C90"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4EC"/>
      <stop offset="68%" stop-color="#FFE2D1"/>
      <stop offset="100%" stop-color="#FAD0BC"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="0.1" y1="0.05" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#A8E0FF"/>
      <stop offset="50%" stop-color="#4E9FE4"/>
      <stop offset="100%" stop-color="#1F5AA4"/>
    </linearGradient>
    <linearGradient id="clothGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D5E9FB"/>
    </linearGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF93AE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FF93AE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="236" fill="#FFFFFF" opacity="0.16"/>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="84" cy="128" r="11"/>
    <circle cx="116" cy="90" r="6"/>
    <circle cx="432" cy="112" r="14"/>
    <circle cx="466" cy="192" r="7"/>
    <circle cx="66" cy="332" r="8"/>
  </g>
  <g fill="#FFFFFF" opacity="0.85">
    <path d="M104 196 L110 214 L128 220 L110 226 L104 244 L98 226 L80 220 L98 214 Z"/>
    <path d="M418 300 L422 312 L434 316 L422 320 L418 332 L414 320 L402 316 L414 312 Z"/>
  </g>

  <!-- 后发 -->
  <path d="M256 94 C 152 94 100 180 100 278 C 100 364 122 436 158 484 L 354 484 C 390 436 412 364 412 278 C 412 180 360 94 256 94 Z"
        fill="url(#hairBack)"/>
  <g fill="none" stroke="#8CC7F4" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round">
    <path d="M134 302 C 142 352 156 400 178 442"/>
    <path d="M378 302 C 370 352 356 400 334 442"/>
  </g>

  <!-- 脖子 -->
  <path d="M230 316 L 230 392 C 230 408 282 408 282 392 L 282 316 Z" fill="#F2C6AF"/>
  <path d="M232 330 C 244 344 268 344 280 330 L 280 348 C 266 360 246 360 232 348 Z" fill="#E5AE95" opacity="0.75"/>

  <!-- 衣服 -->
  <path d="M256 392 C 208 392 168 416 148 472 C 142 486 138 500 136 512 L 376 512 C 374 500 370 486 364 472 C 344 416 304 392 256 392 Z"
