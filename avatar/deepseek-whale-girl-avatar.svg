  <path d="M242 314 C 248 323 255 317 256 316" fill="none" stroke="#C4675F" stroke-width="5" stroke-linecap="round"/>
  <path d="M270 314 C 264 323 257 317 256 316" fill="none" stroke="#C4675F" stroke-width="5" stroke-linecap="round"/>

  <!-- 刘海 -->
  <path d="M162 224 C 154 156 198 110 256 110 C 314 110 358 156 350 224
           C 340 192 330 176 318 168
           C 322 190 318 206 308 218
           C 302 200 292 182 280 170
           C 282 194 276 208 266 220
           C 262 202 254 182 244 170
           C 242 194 234 208 224 218
           C 220 200 212 182 200 170
           C 200 192 192 206 180 218 Z"
        fill="url(#hairFront)"/>

  <!-- 侧发 -->
  <g fill="url(#hairFront)">
    <path d="M168 200 C 148 250 144 318 154 392 C 158 418 164 440 170 458 C 178 434 184 406 186 378 C 178 332 176 288 182 242 C 180 222 176 208 168 200 Z"/>
    <path d="M344 200 C 364 250 368 318 358 392 C 354 418 348 440 342 458 C 334 434 328 406 326 378 C 334 332 336 288 330 242 C 332 222 336 208 344 200 Z"/>
  </g>

  <!-- 发丝高光 -->
  <path d="M196 156 C 226 126 292 124 322 152 C 288 142 232 142 196 156 Z" fill="#D6F0FF" opacity="0.55"/>
  <path d="M204 180 C 214 164 226 156 238 150 C 228 166 222 182 220 198 Z" fill="#E4F6FF" opacity="0.4"/>
  <path d="M181 264 C 177 302 179 348 187 386 C 183 348 181 302 181 264 Z" fill="#9ED4F7" opacity="0.45"/>

  <!-- 小鱼尾发饰 -->
  <g transform="translate(346,206) rotate(16) scale(0.4)">
    <path d="M-5 60 C -12 30 -24 8 -50 -4 C -76 -16 -102 -12 -116 2 C -92 9 -70 26 -60 48 C -52 67 -47 84 -45 96 C -30 76 -16 65 -5 60 Z"
